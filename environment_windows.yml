name: mm-vap
channels:
  - conda-forge
dependencies:
  - python=3.10.16
  - pip=24.0
  - setuptools=69.5.1
  - wheel=0.43.0
  # Match the pip numerical stack so Conda does not install NumPy 2 first.
  - numpy=1.26.4
  # PyPI has no official Windows dlib wheel. This avoids requiring Visual Studio.
  - dlib=19.24.5
  # Supplies ffmpeg.exe for MoviePy and ffmpeg-python.
  - ffmpeg=8.1.2
  - pip:
      # Includes the core file and every optional face-detector backend.
      - -r requirements_windows_optional.txt
